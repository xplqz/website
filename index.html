/* VOICE: 조용하고 깊다. 말보다 그림이 먼저.

   LAYOUT: 그림 위에 떠 있는 좁은 글 기둥, 섹션마다 그림이 다른 얼굴을 보인다. */
:root{color-scheme:dark;--bone:#EFE7D8;--mute:#BDB4A4;--ink:#07070A}
html{scroll-behavior:smooth}
#projects{scroll-margin-top:0}
*{box-sizing:border-box;min-width:0}

a{color:inherit}

.hint{position:absolute;right:max(4vw,16px);bottom:28px;font-size:13px;color:var(--mute)}
.room{min-height:90vh;display:grid;align-items:center;padding:clamp(48px,8vw,120px) max(4vw,16px)}
.card{max-width:620px;background:rgba(7,7,10,.72);padding:clamp(24px,4vw,48px);border-radius:2px}

.card p{word-break:keep-all}
.card{position:relative}
.js .card.gauge{clip-path:inset(0 100% 0 0);transform:none;transition:clip-path 1.05s cubic-bezier(.65,0,.35,1)}
.js .card.gauge::after{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:#7FB0FF;box-shadow:0 0 18px 4px #4D8DFF;transition:left 1.05s cubic-bezier(.65,0,.35,1),opacity 0.28s ease 1.05s}
.js .card.gauge.in{clip-path:inset(0 0 0 0)}
.td{width:clamp(84px,9vw,112px);margin-bottom:22px}
.td svg{display:block;width:100%;height:auto;border-radius:23%;box-shadow:0 18px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.td .arc{stroke-dasharray:100;stroke-dashoffset:var(--v)}
.td .arc.o{--v:25}.td .arc.i{--v:45}
.js .card.gauge .td{opacity:1;transform:none}
.js .card.gauge .arc{stroke-dashoffset:100;opacity:0}

.js .card.gauge.in .arc.o{animation:fillO 0.77s cubic-bezier(0,0,.25,1) 1.43s both}

.js .card.gauge.in .core{animation:core 0.56s cubic-bezier(.34,1.56,.64,1) 2.13s both;transform-origin:96px 96px;transform-box:view-box}
@keyframes fillI{0%{opacity:1;stroke-dashoffset:100;filter:drop-shadow(0 0 5px #9CC2FF)}100%{opacity:1;stroke-dashoffset:var(--v);filter:drop-shadow(0 0 3px #9CC2FF)}}

@keyframes glowOff{to{filter:none}}
@keyframes core{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.18) rotate(-14deg)}100%{transform:none}}
.js .card.gauge.in::after{left:calc(100% - 3px);opacity:0}

.ap{width:clamp(84px,9vw,112px);margin-bottom:22px}
.tile{position:relative;aspect-ratio:1;border-radius:23%;background:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08)}
.aW{position:absolute;left:12.5%;top:19.5%;width:56.4%;height:61.3%;transform-origin:50% 100%}

.dot{position:absolute;left:74.4%;top:66.8%;width:13.2%;height:13.1%;background:#C4161C;border-radius:50%;transform-origin:50% 100%}
.shd{position:absolute;left:72%;top:78.5%;width:18%;height:4%;border-radius:50%;background:rgba(0,0,0,.28);opacity:0}
.js .card.in .aW{animation:awake 1.19s cubic-bezier(.3,0,.3,1) 0.94s both}
.js .card.sweep{clip-path:inset(0 0 0 100%);transform:none;transition:clip-path 0.91s cubic-bezier(.65,0,.35,1)}
.js .card.sweep.in{clip-path:inset(0 0 0 0)}
.js .card.sweep::after{content:"";position:absolute;top:0;bottom:0;right:0;width:3px;background:#FF4A4F;box-shadow:0 0 18px 4px #C4161C;transition:right 0.91s cubic-bezier(.65,0,.35,1),opacity 0.28s ease 0.91s}
.js .card.sweep.in::after{right:calc(100% - 3px);opacity:0}
.js .card.in .aA{animation:react 1.12s ease 2.06s both}
.js .card.in .dot{animation:fall 0.88s 2.06s both}
.js .card.in .shd{animation:shd 0.88s 2.06s both}

0%{transform:scale(1.35,.1)}
16%{transform:translateY(-16%) scale(.8,1.3)}
30%{transform:translateY(0) scale(1.15,.84)}
40%{transform:scale(.95,1.06)}

0%{transform:none}

40%{transform:skewX(11deg) scale(.97,1.06)}
47%{transform:scale(1.12,.82)}
60%{transform:translateY(-18%) scale(.9,1.14)}
74%{transform:translateY(0) scale(1.1,.88)}
86%{transform:scale(.97,1.03)}
100%{transform:none}}

0%{opacity:0;border-radius:50%;transform:translateY(-640%) scale(.9,1.15);animation-timing-function:cubic-bezier(.55,0,1,.45)}
1%{opacity:1}
36%{transform:translateY(0) scale(1.4,.58);animation-timing-function:cubic-bezier(0,.55,.45,1)}
52%{transform:translateY(-190%) scale(.9,1.12);animation-timing-function:cubic-bezier(.55,0,1,.45)}
68%{transform:translateY(0) scale(1.22,.78);animation-timing-function:cubic-bezier(0,.55,.45,1)}
78%{transform:translateY(-55%) scale(.97,1.04);animation-timing-function:cubic-bezier(.55,0,1,.45)}
88%{transform:translateY(0) scale(1.1,.9)}
100%{opacity:1;border-radius:50%;transform:none}}
@keyframes shd{0%{opacity:0;transform:scale(.2)}36%{opacity:1;transform:scale(1.1)}52%{opacity:.35;transform:scale(.55)}68%{opacity:.9;transform:scale(1)}78%{opacity:.6;transform:scale(.8)}88%,92%{opacity:.8;transform:scale(1)}100%{opacity:0}}
.js .card{clip-path:inset(0 0 100% 0);transform:translateY(70px);transition:clip-path 0.77s cubic-bezier(.7,0,.2,1),transform 0.77s cubic-bezier(.7,0,.2,1)}
.js .card>*{opacity:0;transform:translateY(24px);transition:opacity 0.49s ease,transform 0.56s cubic-bezier(.2,.8,.2,1)}
.js .card .ico{transform:translateY(30px) scale(.6) rotate(-12deg);transition:opacity 0.42s ease,transform 0.7s cubic-bezier(.34,1.56,.64,1)}
.js .card .split{opacity:1;transform:none}
.js .card .split span{opacity:0;transform:translateY(.5em) rotate(8deg);transition:opacity 0.35s ease,transform 0.49s cubic-bezier(.2,.8,.2,1)}
.js .card.in{clip-path:inset(0 0 0 0);transform:none}
.js .card.in>*,.js .card.in .split span{opacity:1;transform:none}

.quote{min-height:80vh;display:grid;place-items:center;text-align:center;padding:60px 16px}
.quote p{margin:0;font-size:clamp(28px,4.4vw,52px);font-weight:900;line-height:1.2;max-width:15em;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.35)}
footer{background:#141416;padding:30px max(4vw,16px) 34px;color:var(--bone)}

footer .fl i{font-style:normal;margin:0 8px;opacity:.7}
footer .cp{margin-top:12px;font-size:14px}
a:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
.burger{display:none}.mnav{display:none}
@media(max-width:600px){
nav .links{display:none}
.burger{display:grid;align-content:center;gap:6px;width:44px;height:44px;margin-right:-10px;padding:0 10px;background:none;border:0;cursor:pointer;position:relative;z-index:7}
.burger i{display:block;height:2px;background:var(--bone);border-radius:2px;transition:transform .35s cubic-bezier(.65,0,.35,1),opacity .2s}
.menu-open .burger i:nth-child(1){transform:translateY(8px) rotate(45deg)}
.menu-open .burger i:nth-child(2){opacity:0}
.menu-open .burger i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.mnav{display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,2vh,18px);position:fixed;inset:0;z-index:4;padding:80px max(4vw,16px);background:rgba(7,7,10,.86);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
.mnav a{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:900;font-size:clamp(40px,13vw,64px);line-height:1;letter-spacing:-.02em;color:var(--bone);text-decoration:none;padding:6px 0;transform:translateY(40px);opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
.menu-open .mnav{opacity:1;visibility:visible;transition:opacity .35s ease}
.menu-open .mnav a{transform:none;opacity:1}
.menu-open .mnav a:nth-child(2){transition-delay:.06s}.menu-open .mnav a:nth-child(3){transition-delay:.12s}.menu-open .mnav a:nth-child(4){transition-delay:.18s}
.menu-open body{overflow:hidden}
}
</style>

<script>
{
document.documentElement.classList.add('js');

}
{
const c=document.getElementById('art'),gl=c.getContext('webgl',{antialias:false,premultipliedAlpha:false});
if(gl){
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float;uniform vec2 R;uniform float t;uniform vec2 M;uniform float S;uniform float A;uniform float B;

void main(){
 vec2 uv=gl_FragCoord.xy/R.y;vec2 m=M/R.y;float d=length(uv-m);
 vec2 s=uv*1.3+vec2(0.,S*.6);

 vec2 r=vec2(fbm(s+3.*q+vec2(1.7,9.2)+t*.04+.9*exp(-d*4.)),fbm(s+3.*q+vec2(8.3,2.8)-.6*exp(-d*4.)));

 ink=mix(ink,vec3(.05,.04,.04),B);ultra=mix(ultra,vec3(.10,.09,.09),B*.85);
 vec3 col=mix(ink,ultra,clamp(f*f*2.2,0.,1.));

const sh=(tp,src)=>{const s=gl.createShader(tp);gl.shaderSource(s,src);gl.compileShader(s);return s};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);

gl.useProgram(pr);

const secs=[...document.querySelectorAll('[data-tint]')];let ta=0,tb=0,va=0,vb=0;
const tint=()=>{ta=tb=0;secs.forEach(s=>{const r=s.getBoundingClientRect(),m=(r.top+r.height/2-innerHeight/2)/innerHeight,w=Math.max(0,1-Math.abs(m)*1.6);if(s.dataset.tint==='a')ta=w;else tb=w})};

const size=()=>{const w=Math.round(innerWidth*sc),h=Math.round(innerHeight*sc);c.width=w;c.height=h;gl.viewport(0,0,w,h);tx=mx=w*.6;ty=my=h*.5};
size();addEventListener('resize',size);
addEventListener('pointermove',e=>{tx=e.clientX*sc;ty=(innerHeight-e.clientY)*sc},{passive:true});

addEventListener('touchmove',e=>{const p=e.touches[0];if(p){tx=p.clientX*sc;ty=(innerHeight-p.clientY)*sc;lastTouch=performance.now()}},{passive:true});

const loop=now=>{
  const t=(now-t0)/1000,dt=Math.min(.1,(now-lt)/1000);lt=now;const k=1-Math.pow(.96,dt*60),kt=1-Math.pow(.96,dt*60);
  if(touch&&now-lastTouch>2500){tx=c.width*(.5+.32*Math.sin(t*.21));ty=c.height*(.5+.28*Math.cos(t*.16))}
  mx+=(tx-mx)*k;my+=(ty-my)*k;
  gl.uniform2f(uR,c.width,c.height);gl.uniform1f(uT,t);gl.uniform2f(uM,mx,my);gl.uniform1f(uS,scrollY/innerHeight);va+=(ta-va)*kt;vb+=(tb-vb)*kt;gl.uniform1f(uA,va);gl.uniform1f(uB,vb);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
}}
}
</script>
<script>
{
const b=document.querySelector('.burger'),m=document.getElementById('mnav'),R=document.documentElement;

addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
}
